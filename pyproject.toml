[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "aiadev"
dynamic = ["version"]
description = "CLI for the AI-Augmented Developer framework: validates skills, scaffolds feature specs, installs presets."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "alairjt", email = "alairjt@gmail.com" }]
keywords = ["ai", "agents", "claude", "spec-driven", "skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "build>=1.2",
]

[project.scripts]
aiadev = "aiadev.cli:main"

[project.urls]
Homepage = "https://github.com/suportly/ai-augmented-developer"
Issues = "https://github.com/suportly/ai-augmented-developer/issues"
Changelog = "https://github.com/suportly/ai-augmented-developer/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundle the framework's non-Python assets inside the wheel under
# src/aiadev/_assets/ . They are populated by `python scripts/sync_assets.py`
# before `python -m build`. The runtime resolves them via paths.py's
# package-bundled-assets fallback so `pip install aiadev` works without
# the framework checkout on disk.
aiadev = [
  "_assets/constitution.md",
  "_assets/templates/**/*",
  "_assets/schemas/**/*",
  "_assets/skills/**/*",
  "_assets/presets/**/*",
  "_assets/agents/**/*",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src/aiadev"]
omit = ["src/aiadev/__main__.py"]
