name: publish

# Publishes the aiadev wheel + sdist to PyPI on every GitHub release
# event. Authentication is OIDC trusted publishing — no API tokens
# stored in this repo. The maintainer must configure the trusted
# publisher on pypi.org once before the first publish runs; see
# docs/RELEASING.md.

on:
  release:
    types: [published]

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install --upgrade build

      - name: Sync framework assets into the package
        run: python scripts/sync_assets.py

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload built artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # The `pypi` environment must be configured on the GitHub repo
    # under Settings -> Environments. The trusted publisher entry on
    # pypi.org references this same name. See docs/RELEASING.md.
    environment:
      name: pypi
      url: https://pypi.org/p/aiadev

    permissions:
      id-token: write   # required for OIDC trusted publishing

    steps:
      - name: Download built artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
