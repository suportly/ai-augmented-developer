name: publish

# Publishes the aiadev wheel + sdist to PyPI on every GitHub release
# event, plus on manual dispatch so a failed release can be retried
# without retagging. Authentication uses the PYPI_API_TOKEN repo secret
# (scoped API token on pypi.org). See docs/RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install --upgrade build

      - name: Sync framework assets into the package
        run: python scripts/sync_assets.py

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload built artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Optional GitHub `pypi` environment; if configured, deployment
    # protection rules can gate publishes behind an approver.
    environment:
      name: pypi
      url: https://pypi.org/p/aiadev

    steps:
      - name: Download built artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
