name: validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: skills frontmatter (aiadev validate)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install aiadev (editable)
        run: pip install -e '.[dev]'

      - name: Validate every SKILL.md via the CLI
        run: aiadev validate

  tests:
    name: pytest (aiadev unit tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install aiadev (editable, with dev extras)
        run: pip install -e '.[dev]'

      - name: Configure git for the isolated_framework fixture
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"

      - name: Run pytest with coverage
        run: pytest --cov=src/aiadev --cov-report=term --cov-fail-under=80

  doctor:
    name: aiadev doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install aiadev (editable)
        run: pip install -e '.[dev]'

      - name: Run aiadev doctor
        run: aiadev doctor

  markdown:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  clarifications:
    name: no lingering [NEEDS CLARIFICATION]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for unresolved clarification markers
        shell: bash
        run: |
          set -euo pipefail
          # A spec or plan with unresolved [NEEDS CLARIFICATION: ...]
          # markers is, by Article I of the constitution, not approved.
          # Allowed inside templates/ (scaffolding) and inside
          # CONTRIBUTING.md / CHANGELOG.md / skills/ (where they are
          # documented as a convention, not left unresolved).
          offenders=$(git grep -n -E '\[NEEDS CLARIFICATION' \
            -- 'specs/**' \
            ':(exclude)templates/' \
            ':(exclude)CONTRIBUTING.md' \
            ':(exclude)CHANGELOG.md' \
            ':(exclude)skills/**' || true)
          if [ -n "$offenders" ]; then
            echo "Unresolved clarification markers found:" >&2
            echo "$offenders" >&2
            exit 1
          fi

  links:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --exclude-path node_modules
            --exclude-path .venv
            --exclude-path .claude
            --exclude-path templates
            --exclude "^https://github.com/alairjt/ai-augmented-developer"
            --exclude "^https://github.com/suportly/ai-augmented-developer"
            './**/*.md'
          fail: true
