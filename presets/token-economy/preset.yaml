name: token-economy
version: 1.0.0
description: >
  Opt-in preset that declares the smart-mcp-proxy MCP server (long command
  output condensed to error lines + excerpt, or by a local Ollama model when
  opted in) and ships the Claude Code PreToolUse hook snippet that routes the
  native Bash tool through it. Nothing mandatory; no model required.
  See specs/0022-smart-mcp-proxy-token-economy/.

variables:
  - name: PROJECT_NAME
    prompt: Project display name
    required: true

provides:
  agent_file: CLAUDE.md
  skills: []                        # no preset-specific skills

adds_articles: []
tightens: []
